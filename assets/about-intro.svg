<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-label="Profile introduction styled as a field journal"><rect width="1100" height="260" rx="16" fill="#17251F" stroke="#526B58"/><path d="M730 0V260" stroke="#526B58"/><text x="38" y="46" fill="#A9C5AE" font-family="monospace" font-size="13" letter-spacing="3">NOTES FROM THE TRAIL</text><text x="38" y="91" fill="#E4DDC8" font-family="Georgia,serif" font-size="27">Curiosity is my compass.</text><text x="38" y="130" fill="#C6D0C7" font-family="Arial,sans-serif" font-size="16">I'm an independent developer exploring cybersecurity, cloud</text><text x="38" y="156" fill="#C6D0C7" font-family="Arial,sans-serif" font-size="16">infrastructure and the systems beneath everyday technology.</text><text x="38" y="198" fill="#C6D0C7" font-family="Arial,sans-serif" font-size="16">I learn by building practical tools, breaking problems into parts,</text><text x="38" y="224" fill="#C6D0C7" font-family="Arial,sans-serif" font-size="16">and understanding how things work from the ground up.</text><g transform="translate(775 40)"><rect width="275" height="180" rx="12" fill="#101714" stroke="#526B58"/><text x="22" y="34" fill="#A9C5AE" font-family="monospace" font-size="12">CURRENT ENVIRONMENT</text><text x="22" y="70" fill="#E4DDC8" font-family="monospace" font-size="17">OS       Arch Linux</text><text x="22" y="101" fill="#E4DDC8" font-family="monospace" font-size="17">EDITOR   Neovim</text><text x="22" y="132" fill="#E4DDC8" font-family="monospace" font-size="17">FOCUS    Security</text><text x="22" y="160" fill="#929B91" font-family="monospace" font-size="11">LEARN · BUILD · INVESTIGATE</text></g></svg>