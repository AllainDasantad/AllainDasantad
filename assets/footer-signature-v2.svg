<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Keep learning. Keep building."><title>Keep learning. Keep building.</title><defs><linearGradient id="zbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#050D19"/></linearGradient><radialGradient id="zglow" cx="85%" cy="12%" r="75%"><stop stop-color="#123B63" stop-opacity=".7"/><stop offset="1" stop-color="#0B1F3A" stop-opacity="0"/></radialGradient></defs><style>.serif{font-family:Georgia,'Palatino Linotype',serif}.sans{font-family:Arial,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect width="1200" height="210" rx="18" fill="url(#zbg)"/><rect width="1200" height="210" rx="18" fill="url(#zglow)"/><path d="M100 48H1100M100 162H1100" stroke="#4F8FCB" stroke-opacity=".4"/><circle cx="600" cy="48" r="3" fill="#B9D7F5"/><circle cx="600" cy="162" r="3" fill="#B9D7F5"/><text class="serif signature-title" x="600" y="108" text-anchor="middle" font-size="55" font-style="italic" fill="#EAF3FF">Keep learning. Keep building.</text><style>
@keyframes signatureReveal{from{opacity:0;letter-spacing:8px}to{opacity:1;letter-spacing:0}}
@keyframes signatureDraw{to{stroke-dashoffset:0}}
@keyframes signatureSpark{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-115px);opacity:0}}
.signature-title{animation:signatureReveal 2s cubic-bezier(.16,1,.3,1) both}
.signature-rule{stroke-dasharray:1000;stroke-dashoffset:1000;animation:signatureDraw 2.6s ease .4s forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0}}
</style>
<path class="signature-rule" d="M140 178H1060" stroke="#4F8FCB" stroke-opacity=".65" fill="none"/>
<g fill="#B9D7F5"><circle cx="220" cy="205" r="1.6"><animate attributeName="cy" values="205;55" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="7s" repeatCount="indefinite"/></circle><circle cx="970" cy="205" r="1.8"><animate attributeName="cy" values="205;72" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="6s" repeatCount="indefinite"/></circle></g><defs><radialGradient id="sapphireBlob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B9D7F5" stop-opacity=".95"/><stop offset=".32" stop-color="#4F8FCB" stop-opacity=".82"/><stop offset=".72" stop-color="#123B63" stop-opacity=".55"/><stop offset="1" stop-color="#071426" stop-opacity="0"/></radialGradient><filter id="sapphireBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="15.75"/></filter><clipPath id="sapphireClip"><rect x="0" y="0" width="1200" height="210" rx="16.8"/></clipPath></defs><g class="sapphire-blob-effect" clip-path="url(#sapphireClip)" style="mix-blend-mode:screen" opacity=".18"><ellipse cx="864" cy="88.2" rx="192" ry="88.2" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)"><animate attributeName="cx" values="864;576;912;864" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="88.2;142.8;58.800000000000004;88.2" dur="9s" repeatCount="indefinite"/></ellipse><ellipse cx="300" cy="163.8" rx="111.35999999999999" ry="54.684000000000005" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)" opacity=".7"><animate attributeName="cx" values="300;504;216;300" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="163.8;50.4;155.4;163.8" dur="12s" repeatCount="indefinite"/></ellipse></g><style>@media(prefers-reduced-motion:reduce){.sapphire-blob-effect{display:none}}</style>
<!-- Signature gets a travelling highlight and a breathing constellation -->
<g pointer-events="none" fill="none">
  <path d="M100 48H1100" stroke="#B9D7F5" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="80 920">
    <animate attributeName="stroke-dashoffset" values="0;-1000" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle cx="160" cy="105" r="2" fill="#B9D7F5"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="112" r="2" fill="#B9D7F5"><animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="185" r="24" stroke="#4F8FCB" stroke-opacity=".28" stroke-dasharray="2 6">
    <animate attributeName="r" values="18;30;18" dur="6s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
