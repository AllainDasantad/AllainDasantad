
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101B18"/>
      <stop offset="100%" stop-color="#24382F"/>
    </linearGradient>
    <linearGradient id="mist">
      <stop offset="0%" stop-color="#A8B8A0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A8B8A0" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#A8B8A0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Distant mountains -->
  <path d="M0 260 L150 130 L260 240 L390 100 L540 250
           L700 145 L850 260 L1020 115 L1200 260 V400 H0Z"
        fill="#31483C" opacity=".55"/>

  <!-- Fog -->
  <rect x="0" y="210" width="1200" height="75" fill="url(#mist)"/>
  <rect x="0" y="290" width="1200" height="35" fill="url(#mist)"/>

  <!-- Forest silhouettes -->
  <g fill="#101B18">
    <path d="M0 330 L45 225 L90 330 L70 330 L120 205
             L170 330 L150 330 L200 235 L250 330 Z"/>
    <path d="M900 330 L950 210 L1000 330 L980 330
             L1030 180 L1080 330 L1060 330
             L1120 220 L1180 330 L1200 330 V400 H900Z"/>
  </g>

  <!-- Typography -->
  <text x="600" y="170"
        text-anchor="middle"
        fill="#E7E5D8"
        font-family="monospace"
        font-size="54"
        font-weight="600"
        letter-spacing="8">
    ALLAIN DASANTAD
  </text>

  <text x="600" y="215"
        text-anchor="middle"
        fill="#A8B8A0"
        font-family="monospace"
        font-size="17"
        letter-spacing="4">
    CYBERSECURITY · SOFTWARE · LINUX
  </text>

  <!-- Decorative line -->
  <line x1="460" y1="245" x2="740" y2="245"
        stroke="#A8B8A0" stroke-opacity=".5"/>

  <!-- Footer detail -->
  <text x="600" y="370"
        text-anchor="middle"
        fill="#A8B8A0"
        font-family="monospace"
        font-size="12"
        letter-spacing="3">
    EXPLORING THE DIGITAL WILDERNESS
  </text>
</svg>

