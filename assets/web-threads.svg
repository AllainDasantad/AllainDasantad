<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc"><defs><radialGradient id="sapphireBlob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B9D7F5" stop-opacity=".95"/><stop offset=".32" stop-color="#4F8FCB" stop-opacity=".82"/><stop offset=".72" stop-color="#123B63" stop-opacity=".55"/><stop offset="1" stop-color="#071426" stop-opacity="0"/></radialGradient><filter id="sapphireBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22.5"/></filter><clipPath id="sapphireClip"><rect x="0" y="0" width="1200" height="300" rx="20"/></clipPath></defs>
<title id="title">Midnight Sapphire Web Threads</title>
<desc id="desc">Six animated sapphire-blue threads flowing through a glowing white centre on a midnight navy background.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#050D19"/></linearGradient>
  <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#123B63" stop-opacity=".25"/><stop offset=".35" stop-color="#334782"/><stop offset=".5" stop-color="#EAF3FF"/><stop offset=".68" stop-color="#4F8FCB"/><stop offset="1" stop-color="#123B63" stop-opacity=".25"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".15" stop-color="#B9D7F5" stop-opacity=".55"/><stop offset="1" stop-color="#4F8FCB" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<g fill="none" stroke-linecap="round" filter="url(#glow)">
  <path stroke="url(#thread)" stroke-width="2.4" d="M0 76 C180 20 320 35 600 150 S980 270 1200 190"><animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0 76 C180 20 320 35 600 150 S980 270 1200 190;M0 110 C180 245 340 255 600 150 S1000 30 1200 110;M0 76 C180 20 320 35 600 150 S980 270 1200 190"/></path>
  <path stroke="#123B63" stroke-width="1.5" d="M0 105 C190 35 360 65 600 150 S1000 230 1200 150"><animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 105 C190 35 360 65 600 150 S1000 230 1200 150;M0 185 C190 250 360 225 600 150 S1000 40 1200 115;M0 105 C190 35 360 65 600 150 S1000 230 1200 150"/></path>
  <path stroke="#4F8FCB" stroke-width="1.8" d="M0 145 C180 100 380 70 600 150 S1020 270 1200 220"><animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 145 C180 100 380 70 600 150 S1020 270 1200 220;M0 190 C180 240 380 250 600 150 S1020 60 1200 95;M0 145 C180 100 380 70 600 150 S1020 270 1200 220"/></path>
  <path stroke="url(#thread)" stroke-width="2.1" d="M0 220 C190 280 380 235 600 150 S1010 15 1200 80"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 220 C190 280 380 235 600 150 S1010 15 1200 80;M0 70 C190 20 380 55 600 150 S1010 285 1200 220;M0 220 C190 280 380 235 600 150 S1010 15 1200 80"/></path>
  <path stroke="#20349c" stroke-width="1.4" d="M0 175 C210 70 390 95 600 150 S980 260 1200 130"><animate attributeName="d" dur="7.5s" repeatCount="indefinite" values="M0 175 C210 70 390 95 600 150 S980 260 1200 130;M0 125 C210 260 390 210 600 150 S980 45 1200 175;M0 175 C210 70 390 95 600 150 S980 260 1200 130"/></path>
  <path stroke="#B9D7F5" stroke-opacity=".65" stroke-width="1.1" d="M0 130 C220 220 390 210 600 150 S990 70 1200 165"><animate attributeName="d" dur="8.5s" repeatCount="indefinite" values="M0 130 C220 220 390 210 600 150 S990 70 1200 165;M0 220 C220 80 390 75 600 150 S990 240 1200 125;M0 130 C220 220 390 210 600 150 S990 70 1200 165"/></path>
</g>
<circle cx="600" cy="150" r="52" fill="url(#core)"><animate attributeName="r" values="42;58;42" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="150" r="3.5" fill="#FFFFFF"><animate attributeName="opacity" values=".7;1;.7" dur="2.4s" repeatCount="indefinite"/></circle>
<g fill="#4F8FCB"><circle cx="150" cy="62" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="1040" cy="72" r="1.5"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="920" cy="242" r="1.2"><animate attributeName="opacity" values=".2;.9;.2" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="260" cy="238" r="1.2"><animate attributeName="opacity" values=".8;.2;.8" dur="4.2s" repeatCount="indefinite"/></circle></g>
<g class="sapphire-blob-effect" clip-path="url(#sapphireClip)" style="mix-blend-mode:screen" opacity=".18"><ellipse cx="864" cy="126" rx="192" ry="126" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)"><animate attributeName="cx" values="864;576;912;864" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="126;204.00000000000003;84.00000000000001;126" dur="9s" repeatCount="indefinite"/></ellipse><ellipse cx="300" cy="234" rx="111.35999999999999" ry="78.12" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)" opacity=".7"><animate attributeName="cx" values="300;504;216;300" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="234;72;222;234" dur="12s" repeatCount="indefinite"/></ellipse></g><style>@media(prefers-reduced-motion:reduce){.sapphire-blob-effect{display:none}}</style>
<!-- Animated light pulse travelling along the thread field -->
<g fill="none" pointer-events="none" stroke-linecap="round">
  <path d="M0 150 C210 20 390 70 600 150 S990 270 1200 130" stroke="#EAF3FF" stroke-opacity=".8" stroke-width="1.6" stroke-dasharray="1 34" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-350" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M0 150 C210 20 390 70 600 150 S990 270 1200 130" stroke="#4F8FCB" stroke-opacity=".65" stroke-width="7" stroke-dasharray="1 160">
    <animate attributeName="stroke-dashoffset" values="0;-640" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M0 150H1200" stroke="#B9D7F5" stroke-opacity=".08" stroke-dasharray="3 12">
    <animate attributeName="stroke-dashoffset" values="0;150" dur="12s" repeatCount="indefinite"/>
  </path>
</g>
<circle cx="600" cy="150" r="78" fill="none" stroke="#4F8FCB" stroke-opacity=".18" stroke-dasharray="2 9">
  <animate attributeName="r" values="50;100;50" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".55;0;.55" dur="5s" repeatCount="indefinite"/>
</circle>
</svg>
