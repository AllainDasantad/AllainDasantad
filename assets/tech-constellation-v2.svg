<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Toolkit: Python, C, C++, Rust; cloud security architecture and penetration testing; AWS, Google Cloud, Azure, Docker and Kubernetes; frontend; Arch Linux and BlackArch; Git, GitHub and Postman">
<title>Toolkit</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#050D19"/></linearGradient>
 <radialGradient id="glow" cx="86%" cy="8%" r="78%"><stop stop-color="#123B63" stop-opacity=".62"/><stop offset="1" stop-color="#0B1F3A" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="410" rx="18" fill="url(#bg)"/><rect width="1200" height="410" rx="18" fill="url(#glow)"/>
<g class="toolkit-card" fill="#071426" stroke="#4F8FCB" stroke-opacity=".34" stroke-width="1.2">
 <rect x="24" y="22" width="360" height="166" rx="14"/><rect x="420" y="22" width="360" height="166" rx="14"/><rect x="816" y="22" width="360" height="166" rx="14"/>
 <rect x="24" y="214" width="360" height="166" rx="14"/><rect x="420" y="214" width="360" height="166" rx="14"/><rect x="816" y="214" width="360" height="166" rx="14"/>
</g>
<!-- Every text element uses the same 18px font size for consistent visual hierarchy. -->
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
 <g fill="#69B8FF" letter-spacing="1.1">
  <text x="52" y="58">01 / LANGUAGES</text>
  <text x="448" y="58">02 / SECURITY</text>
  <text x="844" y="58">03 / DATA &amp; INFRASTRUCTURE</text>
  <text x="52" y="250">04 / FRONTEND</text>
  <text x="448" y="250">05 / OPERATING SYSTEMS</text>
  <text x="844" y="250">06 / TOOLS &amp; FUNDAMENTALS</text>
 </g>
 <g fill="#E7F0FC">
  <text x="52" y="101">Python · C · C++ · Rust</text>
  <text x="448" y="101">Cloud Security Architect</text>
  <text x="844" y="101">AWS · Google Cloud · Azure</text>
  <text x="52" y="293">React · TypeScript</text>
  <text x="448" y="293">Arch Linux · BlackArch</text>
  <text x="844" y="293">Git · GitHub · Postman</text>
 </g>
 <g fill="#B4C5D9">
  <text x="448" y="139">Penetration Testing</text>
  <text x="844" y="139">Docker · Kubernetes</text>
  <text x="52" y="331">JavaScript · HTML · CSS</text>
 </g>
</g>
<style>
@keyframes toolkitGlow{0%,100%{stroke-opacity:.28}50%{stroke-opacity:.72}}
@keyframes toolkitFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.toolkit-card{animation:toolkitFloat 8s ease-in-out infinite}
.toolkit-card:nth-of-type(2){animation-delay:-1.3s}.toolkit-card:nth-of-type(3){animation-delay:-2.6s}
.toolkit-card:nth-of-type(4){animation-delay:-3.9s}.toolkit-card:nth-of-type(5){animation-delay:-5.2s}.toolkit-card:nth-of-type(6){animation-delay:-6.5s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></svg>