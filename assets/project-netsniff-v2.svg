<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 205" width="1200" height="205" role="img" aria-label="NetSniff — Network Analyzer"><title>NetSniff — Network Analyzer</title><defs><linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#050D19"/></linearGradient><radialGradient id="nglow" cx="85%" cy="12%" r="75%"><stop stop-color="#123B63" stop-opacity=".7"/><stop offset="1" stop-color="#0B1F3A" stop-opacity="0"/></radialGradient></defs><style>.serif{font-family:Georgia,'Palatino Linotype',serif}.sans{font-family:Arial,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect width="1200" height="205" rx="18" fill="url(#nbg)"/><rect width="1200" height="205" rx="18" fill="url(#nglow)"/><rect x="1" y="1" width="1198" height="203" rx="17" fill="none" stroke="#4F8FCB" stroke-opacity=".25"/><text class="mono" x="36" y="38" font-size="12" letter-spacing="2.5" fill="#4F8FCB">01 / NETWORKING · DESKTOP TOOL</text><text class="serif" x="36" y="91" font-size="39" fill="#EAF3FF">NetSniff — Network Analyzer</text><text class="sans" x="38" y="128" font-size="16" fill="#A9BCD0">A desktop tool for live packet capture, packet inspection,</text><text class="sans" x="38" y="154" font-size="16" fill="#A9BCD0">IP and TCP/UDP analysis, TCP streams, and traffic statistics.</text><text class="mono" x="38" y="188" font-size="11" letter-spacing="1" fill="#B9D7F5">REACT 19 · TYPESCRIPT · RUST · TAURI 2 · PCAP</text><rect x="960" y="30" width="200" height="145" rx="14" fill="#050D19" stroke="#4F8FCB" stroke-opacity=".4"/><text class="serif" x="1060" y="126" text-anchor="middle" font-size="72" fill="#B9D7F5">N</text></svg>