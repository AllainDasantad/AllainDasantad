<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 205" width="1200" height="205" role="img" aria-label="NetSniff — Network Analyzer"><title>NetSniff — Network Analyzer</title><defs><linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#050D19"/></linearGradient><radialGradient id="nglow" cx="85%" cy="12%" r="75%"><stop stop-color="#123B63" stop-opacity=".7"/><stop offset="1" stop-color="#0B1F3A" stop-opacity="0"/></radialGradient></defs><style>.serif{font-family:Georgia,'Palatino Linotype',serif}.sans{font-family:Arial,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect width="1200" height="205" rx="18" fill="url(#nbg)"/><rect width="1200" height="205" rx="18" fill="url(#nglow)"/><rect x="1" y="1" width="1198" height="203" rx="17" fill="none" stroke="#4F8FCB" stroke-opacity=".25"/><text class="mono" x="36" y="38" font-size="12" letter-spacing="2.5" fill="#4F8FCB">01 / NETWORKING · DESKTOP TOOL</text><text class="serif" x="36" y="91" font-size="39" fill="#EAF3FF">NetSniff — Network Analyzer</text><text class="sans" x="38" y="128" font-size="16" fill="#A9BCD0">A desktop tool for live packet capture, packet inspection,</text><text class="sans" x="38" y="154" font-size="16" fill="#A9BCD0">IP and TCP/UDP analysis, TCP streams, and traffic statistics.</text><text class="mono" x="38" y="188" font-size="11" letter-spacing="1" fill="#B9D7F5">REACT 19 · TYPESCRIPT · RUST · TAURI 2 · PCAP</text><rect x="960" y="30" width="200" height="145" rx="14" fill="#050D19" stroke="#4F8FCB" stroke-opacity=".4"/><text class="serif" x="1060" y="126" text-anchor="middle" font-size="72" fill="#B9D7F5">N</text><style>
@keyframes projectReveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes projectOrbit{to{transform:rotate(360deg)}}
text{animation:projectReveal 1s cubic-bezier(.16,1,.3,1) both}
.project-orbit{transform-origin:1060px 102px;animation:projectOrbit 24s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="project-orbit" fill="none" stroke="#4F8FCB" stroke-opacity=".5"><circle cx="1060" cy="102" r="82" stroke-dasharray="3 8"/><circle cx="1060" cy="20" r="3" fill="#B9D7F5" stroke="none"/></g>
<path d="M960 176H1160" stroke="#B9D7F5" stroke-opacity=".35" stroke-dasharray="30 170"><animate attributeName="stroke-dashoffset" values="200;0" dur="5s" repeatCount="indefinite"/></path><defs><radialGradient id="sapphireBlob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B9D7F5" stop-opacity=".95"/><stop offset=".32" stop-color="#4F8FCB" stop-opacity=".82"/><stop offset=".72" stop-color="#123B63" stop-opacity=".55"/><stop offset="1" stop-color="#071426" stop-opacity="0"/></radialGradient><filter id="sapphireBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="15.375"/></filter><clipPath id="sapphireClip"><rect x="0" y="0" width="1200" height="205" rx="16.4"/></clipPath></defs><g class="sapphire-blob-effect" clip-path="url(#sapphireClip)" style="mix-blend-mode:screen" opacity=".18"><ellipse cx="864" cy="86.1" rx="192" ry="86.1" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)"><animate attributeName="cx" values="864;576;912;864" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="86.1;139.4;57.400000000000006;86.1" dur="9s" repeatCount="indefinite"/></ellipse><ellipse cx="300" cy="159.9" rx="111.35999999999999" ry="53.382" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)" opacity=".7"><animate attributeName="cx" values="300;504;216;300" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="159.9;49.199999999999996;151.7;159.9" dur="12s" repeatCount="indefinite"/></ellipse></g><style>@media(prefers-reduced-motion:reduce){.sapphire-blob-effect{display:none}}</style>
<!-- Packet signal travelling between the project title and its emblem -->
<g pointer-events="none" fill="none">
  <path d="M40 198H940" stroke="#4F8FCB" stroke-opacity=".25" stroke-width="1"/>
  <path d="M40 198H940" stroke="#B9D7F5" stroke-width="2" stroke-dasharray="2 900" stroke-opacity=".85">
    <animate attributeName="stroke-dashoffset" values="0;-940" dur="4.5s" repeatCount="indefinite"/>
  </path>
  <circle cx="0" cy="198" r="3" fill="#B9D7F5">
    <animate attributeName="cx" values="40;940;40" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;1;.2" dur="9s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
