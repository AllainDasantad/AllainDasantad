<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="title desc">
<title id="title">Allain's sliding repository showcase</title>
<desc id="desc">A continuously scrolling row of five cybersecurity and systems projects.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#050D19"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4F8FCB" stop-opacity="0"/><stop offset=".5" stop-color="#4F8FCB" stop-opacity=".65"/><stop offset="1" stop-color="#4F8FCB" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect x="0" y="0" width="1200" height="220" rx="18"/></clipPath>
</defs>
<rect width="1200" height="220" rx="18" fill="url(#bg)"/>
<g clip-path="url(#clip)">
  <path d="M0 1H1200" stroke="url(#edge)"/>
  <g>
    <g>
      <g transform="translate(28 48)">
        <rect width="210" height="138" rx="12" fill="#0B1F3A" stroke="#4F8FCB" stroke-opacity=".55"/>
        <text x="16" y="65" fill="#EAF3FF" font-family="Georgia,serif" font-size="23">NetSniff</text>
        <text x="16" y="91" fill="#A9BCD0" font-family="Arial,sans-serif" font-size="11">Desktop network analyzer</text>
        <text x="16" y="119" fill="#B9D7F5" font-family="monospace" font-size="9">RUST · TAURI · REACT</text>
      </g>
      <g transform="translate(260 48)">
        <rect width="210" height="138" rx="12" fill="#0B1F3A" stroke="#4F8FCB" stroke-opacity=".55"/>
        <text x="16" y="65" fill="#EAF3FF" font-family="Georgia,serif" font-size="23">SSHGuard Lab</text>
        <text x="16" y="91" fill="#A9BCD0" font-family="Arial,sans-serif" font-size="11">SSH log analysis lab</text>
        <text x="16" y="119" fill="#B9D7F5" font-family="monospace" font-size="9">PYTHON · DOCKER</text>
      </g>
      <g transform="translate(492 48)">
        <rect width="210" height="138" rx="12" fill="#0B1F3A" stroke="#4F8FCB" stroke-opacity=".55"/>
        <text x="16" y="65" fill="#EAF3FF" font-family="Georgia,serif" font-size="23">PySecLab</text>
        <text x="16" y="91" fill="#A9BCD0" font-family="Arial,sans-serif" font-size="11">HTTP header checker</text>
        <text x="16" y="119" fill="#B9D7F5" font-family="monospace" font-size="9">PYTHON · JSON</text>
      </g>
      <g transform="translate(724 48)">
        <rect width="210" height="138" rx="12" fill="#0B1F3A" stroke="#4F8FCB" stroke-opacity=".55"/>
        <text x="16" y="65" fill="#EAF3FF" font-family="Georgia,serif" font-size="22">MAC Address</text>
        <text x="16" y="91" fill="#A9BCD0" font-family="Arial,sans-serif" font-size="11">Interface experimentation</text>
        <text x="16" y="119" fill="#B9D7F5" font-family="monospace" font-size="9">PYTHON · IPROUTE2</text>
      </g>
      <g transform="translate(956 48)">
        <rect width="210" height="138" rx="12" fill="#0B1F3A" stroke="#4F8FCB" stroke-opacity=".55"/>
        <text x="16" y="65" fill="#EAF3FF" font-family="Georgia,serif" font-size="23">Nmap Scanner</text>
        <text x="16" y="91" fill="#A9BCD0" font-family="Arial,sans-serif" font-size="11">Network scanning project</text>
        <text x="16" y="119" fill="#B9D7F5" font-family="monospace" font-size="9">NMAP · NETWORKING</text>
      </g>
    </g>
  
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="36s" repeatCount="indefinite"/>
  </g>
</g>
<style>
@keyframes marqueeGlow{0%,100%{opacity:.25}50%{opacity:.8}}
.marquee-edge{animation:marqueeGlow 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path class="marquee-edge" d="M0 218H1200" stroke="#B9D7F5" stroke-width="2" opacity=".5"/><defs><radialGradient id="sapphireBlob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B9D7F5" stop-opacity=".95"/><stop offset=".32" stop-color="#4F8FCB" stop-opacity=".82"/><stop offset=".72" stop-color="#123B63" stop-opacity=".55"/><stop offset="1" stop-color="#071426" stop-opacity="0"/></radialGradient><filter id="sapphireBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16.5"/></filter><clipPath id="sapphireClip"><rect x="0" y="0" width="1200" height="220" rx="17.6"/></clipPath></defs><g class="sapphire-blob-effect" clip-path="url(#sapphireClip)" style="mix-blend-mode:screen" opacity=".18"><ellipse cx="864" cy="92.39999999999999" rx="192" ry="92.39999999999999" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)"><animate attributeName="cx" values="864;576;912;864" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="92.39999999999999;149.60000000000002;61.60000000000001;92.39999999999999" dur="9s" repeatCount="indefinite"/></ellipse><ellipse cx="300" cy="171.6" rx="111.35999999999999" ry="57.288" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)" opacity=".7"><animate attributeName="cx" values="300;504;216;300" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="171.6;52.8;162.8;171.6" dur="12s" repeatCount="indefinite"/></ellipse></g><style>@media(prefers-reduced-motion:reduce){.sapphire-blob-effect{display:none}}</style>
<!-- Moving scanline and illuminated edge sweep -->
<g clip-path="url(#clip)" pointer-events="none">
  <rect x="0" y="46" width="1200" height="1" fill="#B9D7F5" opacity=".0">
    <animate attributeName="y" values="46;195;46" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.32;0" dur="10s" repeatCount="indefinite"/>
  </rect>
  <path d="M0 216H1200" stroke="#B9D7F5" stroke-opacity=".45" stroke-dasharray="90 1110">
    <animate attributeName="stroke-dashoffset" values="0;-1200" dur="8s" repeatCount="indefinite"/>
  </path>
</g>
</svg>
