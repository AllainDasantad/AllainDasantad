<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="title desc">
<title id="title">Allain's sliding repository showcase</title>
<desc id="desc">A continuously scrolling row of five cybersecurity and systems projects.</desc>
<defs>
