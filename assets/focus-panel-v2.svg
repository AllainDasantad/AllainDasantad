<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 285" width="1200" height="285" role="img" aria-labelledby="focus-title">
<title id="focus-title">Current learning direction</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#050D19"/></linearGradient><radialGradient id="glow" cx="85%" cy="12%" r="75%"><stop stop-color="#123B63" stop-opacity=".7"/><stop offset="1" stop-color="#0B1F3A" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="285" rx="18" fill="url(#bg)"/><rect width="1200" height="285" rx="18" fill="url(#glow)"/>
<g class="focus-card" transform="translate(24 22)"><rect width="360" height="241" rx="14" fill="#071426" stroke="#4F8FCB" stroke-opacity=".34"/><text x="22" y="36" font-family="monospace" font-size="11" letter-spacing="2" fill="#4F8FCB">01 / SECURITY</text><text x="22" y="91" font-family="Georgia,serif" font-size="33" fill="#EAF3FF">Investigate</text><text x="22" y="135" font-family="Arial,sans-serif" font-size="16" fill="#A9BCD0">Network traffic, authentication</text><text x="22" y="162" font-family="Arial,sans-serif" font-size="16" fill="#A9BCD0">events, and attack behaviour.</text><path d="M22 192H338" stroke="#4F8FCB" stroke-opacity=".25"/><text x="22" y="221" font-family="monospace" font-size="11" fill="#B9D7F5">NETWORK ANALYSIS · BLUE TEAM</text></g>
<g class="focus-card" transform="translate(420 22)"><rect width="360" height="241" rx="14" fill="#071426" stroke="#4F8FCB" stroke-opacity=".34"/><text x="22" y="36" font-family="monospace" font-size="11" letter-spacing="2" fill="#4F8FCB">02 / CLOUD</text><text x="22" y="91" font-family="Georgia,serif" font-size="33" fill="#EAF3FF">Build &amp; secure</text><text x="22" y="135" font-family="Arial,sans-serif" font-size="16" fill="#A9BCD0">Cloud infrastructure, identity,</text><text x="22" y="162" font-family="Arial,sans-serif" font-size="16" fill="#A9BCD0">monitoring, and Azure security.</text><path d="M22 192H338" stroke="#4F8FCB" stroke-opacity=".25"/><text x="22" y="221" font-family="monospace" font-size="11" fill="#B9D7F5">AZURE · CLOUD SECURITY</text></g>
<g class="focus-card" transform="translate(816 22)"><rect width="360" height="241" rx="14" fill="#071426" stroke="#4F8FCB" stroke-opacity=".34"/><text x="22" y="36" font-family="monospace" font-size="11" letter-spacing="2" fill="#4F8FCB">03 / ENGINEERING</text><text x="22" y="91" font-family="Georgia,serif" font-size="33" fill="#EAF3FF">Understand deeply</text><text x="22" y="135" font-family="Arial,sans-serif" font-size="16" fill="#A9BCD0">Linux, Python, Rust, and the</text><text x="22" y="162" font-family="Arial,sans-serif" font-size="16" fill="#A9BCD0">systems beneath applications.</text><path d="M22 192H338" stroke="#4F8FCB" stroke-opacity=".25"/><text x="22" y="221" font-family="monospace" font-size="11" fill="#B9D7F5">LINUX · SYSTEMS · PYTHON</text></g>
<style>
@keyframes focusLift{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes focusGlow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.75}}
.focus-card{animation:focusLift 7s ease-in-out infinite}
.focus-card:nth-of-type(2){animation-delay:-2.2s}.focus-card:nth-of-type(3){animation-delay:-4.4s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M24 276H1176" stroke="#4F8FCB" stroke-opacity=".4" stroke-dasharray="3 12"><animate attributeName="stroke-dashoffset" values="0;-90" dur="12s" repeatCount="indefinite"/></path><defs><radialGradient id="sapphireBlob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B9D7F5" stop-opacity=".95"/><stop offset=".32" stop-color="#4F8FCB" stop-opacity=".82"/><stop offset=".72" stop-color="#123B63" stop-opacity=".55"/><stop offset="1" stop-color="#071426" stop-opacity="0"/></radialGradient><filter id="sapphireBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="21.375"/></filter><clipPath id="sapphireClip"><rect x="0" y="0" width="1200" height="285" rx="20"/></clipPath></defs><g class="sapphire-blob-effect" clip-path="url(#sapphireClip)" style="mix-blend-mode:screen" opacity=".18"><ellipse cx="864" cy="119.69999999999999" rx="192" ry="119.69999999999999" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)"><animate attributeName="cx" values="864;576;912;864" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="119.69999999999999;193.8;79.80000000000001;119.69999999999999" dur="9s" repeatCount="indefinite"/></ellipse><ellipse cx="300" cy="222.3" rx="111.35999999999999" ry="74.214" fill="url(#sapphireBlob)" filter="url(#sapphireBlur)" opacity=".7"><animate attributeName="cx" values="300;504;216;300" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="222.3;68.39999999999999;210.9;222.3" dur="12s" repeatCount="indefinite"/></ellipse></g><style>@media(prefers-reduced-motion:reduce){.sapphire-blob-effect{display:none}}</style></svg>